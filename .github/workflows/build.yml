name: Build Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS executable
        run: |
          pyinstaller src/main.py --onefile --distpath dist --name basketballApp-mac --hidden-import PyQt6 --icon assets/bball_new.ico --add-data "assets/bball_new.ico:assets"

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: basketballApp-mac
          path: dist/basketballApp-mac

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller src/main.py --onefile --distpath dist --name basketballApp-win.exe --hidden-import PyQt6 --icon assets/bball_new.ico --add-data "assets/bball_new.ico;assets" --noconsole

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: basketballApp-win
          path: dist/basketballApp-win.exe
